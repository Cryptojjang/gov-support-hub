name: 매일 공고 업데이트 및 배포

on:
  schedule:
    - cron: '0 21 * * *'   # 매일 06:00 (한국시간)
    - cron: '0 4 * * *'    # 매일 13:00 (한국시간) 오후 추가 갱신
  workflow_dispatch:        # Actions 탭에서 수동 실행
  push:
    branches: [main]
    paths-ignore: ['data/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 공고 수집 (기업마당 + K-Startup)
        if: github.event_name != 'push'
        run: node scripts/update.mjs

      - name: 데이터 변경분 커밋
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: 공고 자동 업데이트 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
